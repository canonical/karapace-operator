name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  schedule:
    - cron: '53 0 * * *'  # Daily at 00:53 UTC
  # Triggered on push to branch "main" by .github/workflows/release.yaml
  workflow_call:
    outputs:
      artifact-prefix:
        description: build_charm.yaml `artifact-prefix` output
        value: ${{ jobs.build.outputs.artifact-prefix }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install tox
        # TODO: Consider replacing with custom image on self-hosted runner OR pinning version
        run: python3 -m pip install tox
      - name: Run linters
        run: tox run -e lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install tox
        # TODO: Consider replacing with custom image on self-hosted runner OR pinning version
        run: python3 -m pip install tox
      - name: Run tests
        run: tox run -e unit

  build:
    strategy:
      matrix:
        path:
          - .
          - tests/integration/app-charm
    name: Build charm | ${{ matrix.path }}
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v54
    with:
      path-to-charm-directory: ${{ matrix.path }}
      cache: false

  integration-test:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        tox-environments:
          - integration-charm
          - integration-password-rotation
          - integration-provider
          - integration-tls
          - integration-terraform
        exclude:
          # TODO: remove this exclude when an arm edge release is available.
          - arch: arm64
            tox-environments: integration-terraform
    name: ${{ matrix.tox-environments }} - ${{ matrix.arch }}
    needs:
      - lint
      - unit-test
      - build
    runs-on: ${{ format('self-hosted-linux-{0}-noble-medium', matrix.arch) }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup operator environment
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare --preset machine --extra-debs pipx
          pipx ensurepath
          pipx install poetry tox
      - name: Download packed charm(s)
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Setup terraform if needed
        if: ${{ matrix.tox-environments == 'integration-terraform' }}
        run: |
          sudo snap install --classic terraform
      - name: Select tests
        id: select-tests
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]
          then
            echo Running unstable and stable tests
            echo "mark_expression=" >> $GITHUB_OUTPUT
          else
            echo Skipping unstable tests
            echo "mark_expression=not unstable" >> $GITHUB_OUTPUT
          fi
      - name: Run integration tests
        run: tox run -e ${{ matrix.tox-environments }} -- -m '${{ steps.select-tests.outputs.mark_expression }}'
        env:
          CI_PACKED_CHARMS: ${{ needs.build.outputs.charms }}
